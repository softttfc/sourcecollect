name: 自动调用API解密并注入Sites生成xiaoyu.json

on:
  schedule:
    - cron: '0 */3 * * *' # 每3小时 自动运行
  workflow_dispatch:     # 支持手动点击按钮运行

# 增加并发排队锁：确保多个工作流同时运行时排队执行，防止抢占提交
concurrency:
  group: git-push-main
  cancel-in-progress: false

jobs:
  decrypt_and_process:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 获取完整提交历史，方便后续 rebase 合并

    - name: 1. 请求解密接口并保存基础 JSON (xiaoyu_config.json)
      run: |
        curl -X POST "http://2015888.xyz/jiemi/get_jiemi.php" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          -d "url=http://2015888.xyz/tv/" \
          -o xiaoyu_config.json

    - name: 2. 自动下载最新的真实 spider txt 文件并保存为 xiaoyu.txt
      run: |
        if [ -f "xiaoyu_config.json" ] && grep -q -E "spider|sites" xiaoyu_config.json; then
          # 动态提取原作者最新的 spider 文件链接
          JAR_URL=$(grep -oP '"spider"\s*:\s*"\K[^"]+' xiaoyu_config.json | cut -d';' -f1)
          if [ -n "$JAR_URL" ] && [[ "$JAR_URL" == http* ]]; then
            echo "成功抓取到远程 Spider 文件地址: $JAR_URL"
            curl -L "$JAR_URL" -o xiaoyu.txt
            echo "已成功将原格式 txt 文件下载并保存为 xiaoyu.txt"
          else
            echo "提示：未在配置中找到远程 Spider 链接。"
          fi
        else
          echo "【错误】解密出来的基础 JSON 结构不合法！"
          exit 1
        fi

    - name: 3. 运行内置 Python 逻辑：计算MD5、路径替换、注入 sites 并生成最终的 xiaoyu.json
      shell: python
      run: |
        import json
        import os
        import hashlib

        INPUT_JSON = "xiaoyu_config.json"
        OUTPUT_JSON = "xiaoyu.json"
        LOCAL_JAR = "xiaoyu.txt"

        GITHUB_USER = "woshishiq1"
        GITHUB_REPO = "jiemi"

        BASE_JAR_URL = f"https://down.nigx.cn/raw.githubusercontent.com/{GITHUB_USER}/{GITHUB_REPO}/main/xiaoyu.txt"
        BASE_PREFIX = "http://2015888.xyz/tv/"

        # 1. 校验源 JSON 是否存在
        if not os.path.exists(INPUT_JSON):
            print(f"[-] 未找到源文件 {INPUT_JSON}")
            exit(1)

        # 2. 计算本地下载好的 xiaoyu.txt 的 MD5
        jar_md5 = ""
        if os.path.exists(LOCAL_JAR):
            md5_hash = hashlib.md5()
            with open(LOCAL_JAR, "rb") as f:
                for chunk in iter(lambda: f.read(8192), b""):
                    md5_hash.update(chunk)
            jar_md5 = md5_hash.hexdigest()
            print(f"[+] 计算出本地 xiaoyu.txt 的 MD5: {jar_md5}")
        else:
            print("[!] 未找到本地 xiaoyu.txt，将降级使用无 MD5 模式")

        # 3. 拼接带有 MD5 的完整 URL
        FINAL_JAR_URL = f"{BASE_JAR_URL};md5;{jar_md5}" if jar_md5 else BASE_JAR_URL
        print(f"[+] 最终注入的 Spider 链接: {FINAL_JAR_URL}")

        # 4. 解析 JSON
        with open(INPUT_JSON, "r", encoding="utf-8") as f:
            config_data = json.load(f)

        # 5. 深度递归逻辑：自动将所有以 ./ 开头的相对路径拼接完整前缀
        def fix_relative_paths(data):
            if isinstance(data, dict):
                return {k: fix_relative_paths(v) for k, v in data.items()}
            elif isinstance(data, list):
                return [fix_relative_paths(item) for item in data]
            elif isinstance(data, str):
                if data.startswith("./"):
                    return BASE_PREFIX + data[2:]
                elif data.startswith("/"):
                    return BASE_PREFIX + data[1:]
            return data

        print("[+] 正在批量将 ./ 开头的相对路径拼接为完整 URL...")
        config_data = fix_relative_paths(config_data)

        # A. 更新顶层的 spider 链接为带有 MD5 的地址
        config_data["spider"] = FINAL_JAR_URL
        print("[+] 已更新顶级 spider 链接")

        # B. 遍历 sites 列表进行注入
        sites_list = config_data.get("sites", [])
        if isinstance(sites_list, list):
            updated_count = 0
            skipped_count = 0

            for site in sites_list:
                if isinstance(site, dict):
                    current_jar = site.get("jar")

                    # 如果已有有效的 jar 地址则跳过
                    if current_jar and isinstance(current_jar, str) and current_jar.strip():
                        skipped_count += 1
                        continue

                    # 没有 jar 或为空 → 注入带 MD5 的链接
                    site["jar"] = FINAL_JAR_URL
                    updated_count += 1

            print(f"[+] Sites 注入完成：更新了 {updated_count} 个站点，跳过了 {skipped_count} 个已有 jar 的站点")

        # C. 统一写出为最终文件名 xiaoyu.json
        with open(OUTPUT_JSON, "w", encoding="utf-8") as f:
            json.dump(config_data, f, indent=2, ensure_ascii=False)
        print(f"[+] 最终配置文件已成功生成: {OUTPUT_JSON}")

    - name: 4. 提交最新原版 xiaoyu_config.json、修改版 xiaoyu.json 和 xiaoyu.txt 到仓库
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # 强行添加全部 3 个关键文件
        if [ -f "xiaoyu_config.json" ]; then git add -f xiaoyu_config.json; fi
        if [ -f "xiaoyu.json" ]; then git add -f xiaoyu.json; fi
        if [ -f "xiaoyu.txt" ]; then git add -f xiaoyu.txt; fi

        # 只要有任何更新就提交并推送
        if ! git diff --cached --quiet; then
          git commit -m "自动同步最新原版配置与xiaoyu文件: $(date +'%Y-%m-%d %H:%M:%S')"
          
          # 先拉取远程最新提交（包含其他工作流刚刚提交的代码）并进行变基合并
          git pull origin main --rebase || true
          
          git push origin HEAD
          echo "【成功】xiaoyu_config.json、xiaoyu.json 和 xiaoyu.txt 已同步推送到远程仓库！"
        else
          echo "【提示】内容与上一版本完全一致，无需重复提交。"
        fi
